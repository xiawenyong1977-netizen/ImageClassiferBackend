[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --asyncio-mode=auto
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    # 注意：aiomysql 连接在事件循环关闭后的清理异常（Exception ignored in Connection.__del__）
    # 无法通过警告过滤来忽略，因为它是 Python 垃圾回收过程中的异常
    # 这是测试环境的正常现象，不影响测试结果
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

